<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Electronic Memory — خريطة ذهنية تفاعلية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #141720;
  --surface2: #1c2030;
  --border: rgba(255,255,255,0.07);
  --text: #e8eaf0;
  --muted: #6b7280;
  --accent: #3d7fff;

  --c-auth:    #3d7fff;
  --c-users:   #a855f7;
  --c-records: #22d3ee;
  --c-meds:    #f59e0b;
  --c-appts:   #10b981;
  --c-loc:     #f97316;
  --c-msgs:    #ec4899;
  --c-root:    #e8eaf0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ─── toolbar ─── */
#toolbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: rgba(13,15,20,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

#toolbar h1 {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 0.02em;
  flex: 1;
}

.tb-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.tb-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-btn.primary:hover { background: #2d6fef; }

#hint {
  font-size: 11px;
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ─── canvas ─── */
#viewport {
  position: fixed;
  inset: 52px 0 0 0;
  overflow: hidden;
  cursor: grab;
}
#viewport:active { cursor: grabbing; }

#canvas {
  position: absolute;
  width: 2400px;
  height: 1800px;
  transform-origin: 0 0;
}

svg#lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

/* ─── nodes ─── */
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  cursor: pointer;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), opacity .25s, box-shadow .2s;
  white-space: nowrap;
  border: 1px solid transparent;
  user-select: none;
}
.node:hover { transform: translate(-50%,-50%) scale(1.08); }

.node.root {
  border-radius: 18px;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  width: 170px;
  height: 66px;
  border-width: 1.5px;
  z-index: 20;
  cursor: default;
  flex-direction: column;
  gap: 2px;
}
.node.root:hover { transform: translate(-50%,-50%) scale(1); }
.node.root .sub { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 10px; font-weight: 400; opacity: .65; }

.node.l1 {
  font-size: 13px;
  font-weight: 600;
  padding: 0 18px;
  height: 42px;
  min-width: 130px;
  border-width: 1px;
  z-index: 15;
}
.node.l1 .icon { font-size: 15px; }
.node.l1 .chevron { font-size: 10px; opacity: .6; transition: transform .2s; }
.node.l1.open .chevron { transform: rotate(90deg); }

.node.l2 {
  font-size: 11px;
  font-weight: 400;
  padding: 0 14px;
  height: 32px;
  min-width: 100px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%,-50%) scale(0.6);
  z-index: 10;
}
.node.l2.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%,-50%) scale(1);
}
.node.l2:hover { transform: translate(-50%,-50%) scale(1.1) !important; }

/* ─── color themes per branch ─── */
.t-auth    { background: rgba(61,127,255,.12);  border-color: rgba(61,127,255,.35);  color: #93b4ff; }
.t-users   { background: rgba(168,85,247,.12);  border-color: rgba(168,85,247,.35);  color: #d8b4fe; }
.t-records { background: rgba(34,211,238,.1);   border-color: rgba(34,211,238,.3);   color: #67e8f9; }
.t-meds    { background: rgba(245,158,11,.1);   border-color: rgba(245,158,11,.3);   color: #fcd34d; }
.t-appts   { background: rgba(16,185,129,.1);   border-color: rgba(16,185,129,.3);   color: #6ee7b7; }
.t-loc     { background: rgba(249,115,22,.1);   border-color: rgba(249,115,22,.3);   color: #fdba74; }
.t-msgs    { background: rgba(236,72,153,.1);   border-color: rgba(236,72,153,.3);   color: #f9a8d4; }

.root-node { background: rgba(232,234,240,.08); border-color: rgba(232,234,240,.25); color: var(--text); }

/* ─── tooltip ─── */
#tooltip {
  position: fixed;
  z-index: 200;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--text);
  max-width: 260px;
  line-height: 1.7;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .15s, transform .15s;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
#tooltip.show { opacity: 1; transform: translateY(0); }
#tooltip strong { color: #fff; font-weight: 600; display: block; margin-bottom:4px; }

/* ─── minimap ─── */
#minimap {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 140px;
  height: 90px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  opacity: .75;
}
#minimap-view {
  position: absolute;
  border: 1.5px solid var(--accent);
  border-radius: 3px;
  background: rgba(61,127,255,.1);
  transition: all .05s;
}

/* ─── legend ─── */
#legend {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 11px;
}
#legend h3 { font-size: 10px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ─── bg grid ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>

<div id="toolbar">
  <h1>🧠 My Electronic Memory — خريطة ذهنية</h1>
  <span id="hint">اسحب للتحريك · Scroll للتكبير · اضغط العقد لتوسيعها</span>
  <button class="tb-btn" onclick="expandAll()">توسيع الكل</button>
  <button class="tb-btn" onclick="collapseAll()">طي الكل</button>
  <button class="tb-btn" onclick="resetView()">↺ إعادة ضبط</button>
  <button class="tb-btn primary" onclick="downloadMap()">⬇ تحميل HTML</button>
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="lines"></svg>
  </div>
</div>

<div id="tooltip"></div>

<div id="minimap">
  <div id="minimap-view"></div>
</div>

<div id="legend">
  <h3>المحاور</h3>
</div>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
const BRANCHES = [
  {
    id:'auth', label:'Auth', icon:'🔐', theme:'t-auth', color:'#3d7fff',
    angle:-140, dist:320,
    info:'نظام المصادقة — JWT + bcrypt + صلاحيات الأدوار',
    children:[
      {id:'auth1', label:'Register',    info:'تسجيل مستخدم جديد مع رمز دولة الهاتف. الأطباء ينتظرون موافقة الأدمن.'},
      {id:'auth2', label:'Login / JWT', info:'تسجيل دخول يُنتج JWT token صالح 24 ساعة يُحفظ في localStorage.'},
      {id:'auth3', label:'Role guard',  info:'require_role() يحمي كل endpoint — لا يمكن الوصول بدون الصلاحية الصحيحة.'},
      {id:'auth4', label:'Bcrypt hash', info:'كلمات المرور مشفّرة بـ bcrypt — لا تُخزن أبداً كنص واضح.'},
    ]
  },
  {
    id:'users', label:'Users', icon:'👥', theme:'t-users', color:'#a855f7',
    angle:-90, dist:330,
    info:'أربعة أدوار: مريض، طبيب، مرافق، أدمن',
    children:[
      {id:'u1', label:'Patient',   info:'يرى سجلاته وأدويته ومواعيده. يُشارك موقعه. يراسل طاقم الرعاية.'},
      {id:'u2', label:'Doctor',    info:'يكتب السجلات والوصفات. يجدول المواعيد. يرى موقع المريض.'},
      {id:'u3', label:'Caregiver', info:'يتابع الموقع. يغيّر الطبيب المعيّن. يستلم تنبيهات الخروج من المنطقة الآمنة.'},
      {id:'u4', label:'Admin',     info:'يوافق أو يرفض حسابات الأطباء. يعطّل حسابات. يرى كل المستخدمين.'},
    ]
  },
  {
    id:'records', label:'سجلات طبية', icon:'📋', theme:'t-records', color:'#22d3ee',
    angle:-40, dist:310,
    info:'السجلات الطبية — ينشئها الطبيب ويقرأها المريض',
    children:[
      {id:'r1', label:'Create / Edit', info:'POST /api/records/ — يُنشئ سجل مرتبط بـ doctor_id و patient_id.'},
      {id:'r2', label:'View history',  info:'GET /api/records/patient/{id} — المريض يرى سجلاته فقط، الطبيب يرى الكل.'},
      {id:'r3', label:'Delete',        info:'DELETE /api/records/{id} — الطبيب والأدمن فقط يستطيعان الحذف.'},
    ]
  },
  {
    id:'meds', label:'أدوية', icon:'💊', theme:'t-meds', color:'#f59e0b',
    angle:10, dist:320,
    info:'الأدوية والتذكيرات — وصف، تتبع، تسجيل الجرعات',
    children:[
      {id:'m1', label:'Prescribe',    info:'POST /api/medications/ — الطبيب يصف دواء بجرعة وتكرار وأوقات تذكير.'},
      {id:'m2', label:'Dose log',     info:'POST /api/medications/log — المريض يسجّل كل جرعة: taken أو missed.'},
      {id:'m3', label:'Auto notify',  info:'جرعة فائتة تُنشئ إشعاراً تلقائياً لطاقم الرعاية فوراً.'},
      {id:'m4', label:'Stop med',     info:'PUT /api/medications/{id}/deactivate — الطبيب يوقف وصفة نشطة.'},
    ]
  },
  {
    id:'appts', label:'مواعيد', icon:'📅', theme:'t-appts', color:'#10b981',
    angle:55, dist:310,
    info:'جدولة المواعيد وتتبع حالتها',
    children:[
      {id:'a1', label:'Schedule',     info:'POST /api/appointments/ — الطبيب أو المرافق يجدول موعد. إشعار تلقائي للمريض.'},
      {id:'a2', label:'Status',       info:'PUT /api/appointments/{id}/status — scheduled → completed / cancelled.'},
      {id:'a3', label:'Overdue',      info:'الواجهة تكتشف المواعيد المتأخرة وتعرض badge "Overdue" بالوان تحذيرية.'},
    ]
  },
  {
    id:'loc', label:'موقع GPS', icon:'📍', theme:'t-loc', color:'#f97316',
    angle:110, dist:330,
    info:'تتبع الموقع الجغرافي والمناطق الآمنة',
    children:[
      {id:'l1', label:'Live tracking',  info:'المريض يُرسل إحداثياته من GPS المتصفح. تُحفظ في location_logs.'},
      {id:'l2', label:'Haversine',      info:'معادلة رياضية تحسب المسافة بالمتر بين نقطتين على الكرة الأرضية.'},
      {id:'l3', label:'Safe zones',     info:'دوائر geofence على خريطة Leaflet. نصف القطر قابل للتخصيص.'},
      {id:'l4', label:'Alert trigger',  info:'خروج المريض من كل المناطق الآمنة → is_safe_zone=False → إشعار فوري.'},
    ]
  },
  {
    id:'msgs', label:'رسائل', icon:'💬', theme:'t-msgs', color:'#ec4899',
    angle:155, dist:310,
    info:'الرسائل والإشعارات بين أطراف الرعاية',
    children:[
      {id:'ms1', label:'Chat thread',    info:'محادثة مباشرة بين أي مستخدمَين. تُقرأ تلقائياً عند فتح المحادثة.'},
      {id:'ms2', label:'Notifications',  info:'تيار إشعارات مرمّز: أدوية=أزرق، مواعيد=أخضر، رسائل=بنفسجي، موقع=أحمر.'},
      {id:'ms3', label:'Read receipts',  info:'GET /api/messages/thread/{id} يُعلّم الرسائل مقروءة تلقائياً.'},
    ]
  },
];

const ROOT = { x: 1200, y: 900 };
const SPREAD_ANGLES = [0.32, 0.28, 0.26, 0.26, 0.28, 0.30, 0.32];

/* ═══════════════════════════════════════════
   BUILD POSITIONS
═══════════════════════════════════════════ */
BRANCHES.forEach((b, bi) => {
  const rad = (b.angle * Math.PI) / 180;
  b.x = ROOT.x + Math.cos(rad) * b.dist;
  b.y = ROOT.y + Math.sin(rad) * b.dist;

  const n = b.children.length;
  const spread = SPREAD_ANGLES[bi] || 0.28;
  b.children.forEach((c, ci) => {
    const offset = (ci - (n - 1) / 2) * spread;
    const crad = rad + offset;
    const cdist = 190;
    c.x = b.x + Math.cos(crad) * cdist;
    c.y = b.y + Math.sin(crad) * cdist;
    c.theme = b.theme;
    c.parentId = b.id;
  });
});

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
const canvas = document.getElementById('canvas');
const svgEl  = document.getElementById('lines');
const tooltip = document.getElementById('tooltip');
const expanded = new Set();
const nodeEls  = {};

function buildLegend() {
  const leg = document.getElementById('legend');
  BRANCHES.forEach(b => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${b.color}"></div>${b.icon} ${b.label}`;
    leg.appendChild(item);
  });
}

function makeNode(data, cls) {
  const el = document.createElement('div');
  el.className = `node ${cls} ${data.theme || 'root-node'}`;
  el.id = 'n-' + data.id;
  el.style.left = data.x + 'px';
  el.style.top  = data.y + 'px';

  if (cls === 'root') {
    el.innerHTML = `<span>🧠 My Electronic</span><span>Memory</span>`;
    el.style.cursor = 'default';
  } else if (cls === 'l1') {
    el.innerHTML = `<span class="icon">${data.icon}</span><span>${data.label}</span><span class="chevron">▶</span>`;
    el.addEventListener('click', () => toggleBranch(data.id));
  } else {
    el.textContent = data.label;
    el.addEventListener('click', () => {
      showTooltip(el, `<strong>${data.label}</strong>${data.info}`);
    });
  }

  if (data.info && cls === 'l1') {
    el.addEventListener('mouseenter', e => showTooltip(el, `<strong>${data.icon} ${data.label}</strong>${data.info}`));
    el.addEventListener('mouseleave', hideTooltip);
  }
  if (cls === 'l2') {
    el.addEventListener('mouseenter', e => showTooltip(el, `<strong>${data.label}</strong>${data.info}`));
    el.addEventListener('mouseleave', hideTooltip);
  }

  nodeEls[data.id] = el;
  canvas.appendChild(el);
}

function render() {
  // root
  makeNode({ id:'root', x: ROOT.x, y: ROOT.y, theme:'root-node' }, 'root');

  BRANCHES.forEach(b => {
    makeNode(b, 'l1');
    b.children.forEach(c => makeNode(c, 'l2'));
  });

  buildLegend();
  drawLines();
}

function drawLines() {
  svgEl.innerHTML = '';

  // root → l1
  BRANCHES.forEach(b => {
    drawCurve(ROOT.x, ROOT.y, b.x, b.y, b.color, 1.5, 0.5);

    if (expanded.has(b.id)) {
      b.children.forEach(c => {
        drawCurve(b.x, b.y, c.x, c.y, b.color, 1, 0.4);
      });
    }
  });
}

function drawCurve(x1, y1, x2, y2, color, width, opacity) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', width);
  path.setAttribute('opacity', opacity);
  path.setAttribute('stroke-linecap', 'round');
  svgEl.appendChild(path);
}

function toggleBranch(id) {
  const b = BRANCHES.find(b => b.id === id);
  if (!b) return;

  if (expanded.has(id)) {
    expanded.delete(id);
    nodeEls[id]?.classList.remove('open');
    b.children.forEach(c => nodeEls[c.id]?.classList.remove('visible'));
  } else {
    expanded.add(id);
    nodeEls[id]?.classList.add('open');
    b.children.forEach((c, i) => {
      setTimeout(() => nodeEls[c.id]?.classList.add('visible'), i * 60);
    });
  }
  drawLines();
}

function expandAll() {
  BRANCHES.forEach(b => {
    expanded.add(b.id);
    nodeEls[b.id]?.classList.add('open');
    b.children.forEach((c, i) => {
      setTimeout(() => nodeEls[c.id]?.classList.add('visible'), i * 40);
    });
  });
  setTimeout(drawLines, 300);
}

function collapseAll() {
  BRANCHES.forEach(b => {
    expanded.delete(b.id);
    nodeEls[b.id]?.classList.remove('open');
    b.children.forEach(c => nodeEls[c.id]?.classList.remove('visible'));
  });
  drawLines();
}

/* ═══════════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════════ */
function showTooltip(el, html) {
  tooltip.innerHTML = html;
  tooltip.classList.add('show');
  const r = el.getBoundingClientRect();
  let left = r.left + r.width / 2 - 130;
  let top  = r.top - 10;
  left = Math.max(10, Math.min(left, window.innerWidth - 280));
  if (top < 80) top = r.bottom + 10;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = (top - tooltip.offsetHeight - 6) + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

/* ═══════════════════════════════════════════
   PAN + ZOOM
═══════════════════════════════════════════ */
const vp = document.getElementById('viewport');
let scale = 0.48, tx = -230, ty = -290;
let dragging = false, sx, sy, stx, sty;

function applyTransform() {
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  updateMinimap();
}

function resetView() {
  scale = 0.48; tx = -230; ty = -290;
  applyTransform();
}

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.91;
  const r = vp.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  tx = cx - (cx - tx) * f;
  ty = cy - (cy - ty) * f;
  scale = Math.min(2.5, Math.max(0.2, scale * f));
  applyTransform();
}, { passive: false });

vp.addEventListener('mousedown', e => {
  if (e.target.classList.contains('node')) return;
  dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
});
document.addEventListener('mouseup', () => dragging = false);
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = stx + (e.clientX - sx);
  ty = sty + (e.clientY - sy);
  applyTransform();
});

/* touch */
vp.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; stx = tx; sty = ty;
  }
}, { passive: true });
vp.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  tx = stx + (e.touches[0].clientX - sx);
  ty = sty + (e.touches[0].clientY - sy);
  applyTransform();
}, { passive: true });
vp.addEventListener('touchend', () => dragging = false);

/* ═══════════════════════════════════════════
   MINIMAP
═══════════════════════════════════════════ */
function updateMinimap() {
  const mmW = 140, mmH = 90;
  const cW = 2400, cH = 1800;
  const vpW = vp.offsetWidth, vpH = vp.offsetHeight;
  const visW = vpW / scale, visH = vpH / scale;
  const ox = -tx / scale, oy = -ty / scale;
  const rX = (ox / cW) * mmW;
  const rY = (oy / cH) * mmH;
  const rW = (visW / cW) * mmW;
  const rH = (visH / cH) * mmH;
  const mv = document.getElementById('minimap-view');
  mv.style.left   = Math.max(0, rX) + 'px';
  mv.style.top    = Math.max(0, rY) + 'px';
  mv.style.width  = Math.min(rW, mmW) + 'px';
  mv.style.height = Math.min(rH, mmH) + 'px';
}

/* ═══════════════════════════════════════════
   DOWNLOAD
═══════════════════════════════════════════ */
function downloadMap() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-electronic-memory-mindmap.html';
  a.click();
  URL.revokeObjectURL(a.href);
}
